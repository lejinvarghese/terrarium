<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terrarium 🌿 - AI Ecosystem Visualization</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: radial-gradient(ellipse at top, #0f1419 0%, #050510 100%);
      color: #ffffff;
      overflow: hidden;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .ui-panel {
      pointer-events: auto;
      background: rgba(10, 10, 20, 0.6);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(107, 76, 232, 0.2);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8),
                  inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    #header {
      position: absolute;
      top: 20px;
      left: 20px;
      max-width: 300px;
    }

    #header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #6b4ce8 0%, #00b8ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    #header p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
    }

    #controls {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 250px;
    }

    .control-button {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 8px;
      background: rgba(107, 76, 232, 0.1);
      border: 1px solid rgba(107, 76, 232, 0.3);
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .control-button:hover {
      background: rgba(107, 76, 232, 0.2);
      border-color: rgba(107, 76, 232, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(107, 76, 232, 0.3);
    }

    #activity-feed {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 350px;
      max-height: 300px;
      overflow-y: auto;
    }

    #activity-feed h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #6b4ce8;
      letter-spacing: 0.3px;
    }

    .activity-item {
      padding: 12px;
      margin-bottom: 8px;
      background: rgba(107, 76, 232, 0.08);
      border-left: 2px solid #6b4ce8;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      transition: all 0.2s ease;
    }

    .activity-item:hover {
      background: rgba(107, 76, 232, 0.12);
      border-left-width: 3px;
    }

    .activity-item .time {
      color: rgba(255, 255, 255, 0.5);
      font-size: 11px;
    }

    #status-panel {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 280px;
    }

    #status-panel h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #00b8ff;
      letter-spacing: 0.3px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .status-active { background: #00e5a0; box-shadow: 0 0 10px rgba(0, 229, 160, 0.6); animation: pulse 2s ease-in-out infinite; }
    .status-inactive { background: #e05780; opacity: 0.5; }
    .status-unknown { background: #666; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #00ff88;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <div id="header" class="ui-panel">
      <h1>🌿 Terrarium</h1>
      <p>AI Ecosystem Visualization</p>
    </div>

    <div id="controls" class="ui-panel">
      <button class="control-button" id="toggle-bots">🤖 Toggle Bots</button>
      <button class="control-button" id="toggle-services">⚙️ Toggle Services</button>
      <button class="control-button" id="toggle-particles">✨ Toggle Particles</button>
      <button class="control-button" id="reset-camera">🎥 Reset View</button>
    </div>

    <div id="activity-feed" class="ui-panel">
      <h3>📊 Activity Feed</h3>
      <div id="activity-list"></div>
    </div>

    <div id="status-panel" class="ui-panel">
      <h3>⚡ System Status</h3>
      <div id="status-list"></div>
    </div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p>Loading Terrarium...</p>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
