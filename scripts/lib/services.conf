#!/bin/bash
# Service registry - single source of truth for all Terrarium services
# Format: name|session|display_name|command|working_dir

# Core services
SERVICES=(
    "dome|terrarium-dome|Dome (Open WebUI)|./app.sh|"
    "engine|terrarium-engine|Engine (Scheduler)|python3 src/engine/scheduler.py|"
    "portal|terrarium-portal|Portal (Telegram)|src/portals/telegram/.venv/bin/python -m src.portals.telegram.bot|"
    "bridge|terrarium-bridge|Bridge (mcpo)|uvx mcpo --port 8765 --api-key \"terrarium-mcp-bridge\" --config src/configs/mcpo.json --hot-reload|"
    "notebook|terrarium-notebook|Notebook (Open NB)|scripts/start_notebook.sh|"
)

# Tunnel definitions
# Format: name|session|display_name|port|emoji|send_notification
TUNNELS=(
    "webui|terrarium-tunnel|Open WebUI|8080|🌐|true"
    "notebook-api|terrarium-tunnel-notebook-api|Notebook API|5055|🔌|false"
    "notebook|terrarium-tunnel-notebook|Open Notebook|8502|📓|true"
)

# Service name to session mapping for attach command
declare -A SERVICE_MAP=(
    ["dome"]="terrarium-dome"
    ["engine"]="terrarium-engine"
    ["portal"]="terrarium-portal"
    ["bridge"]="terrarium-bridge"
    ["tunnel"]="terrarium-tunnel"
    ["tunnel-notebook-api"]="terrarium-tunnel-notebook-api"
    ["tunnel-notebook"]="terrarium-tunnel-notebook"
    ["notebook"]="terrarium-notebook"
)
