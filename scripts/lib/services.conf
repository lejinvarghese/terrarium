#!/bin/bash
# Service registry - single source of truth for all Terrarium services
# Format: name|session|display_name|command|working_dir|width|height
# Note: width and height are optional terminal dimensions for tmux sessions

# Core services
SERVICES=(
    "dome|terrarium-dome|Dome|scripts/app.sh|||"
    "dome-proxy|terrarium-dome-proxy|Dome Auth Proxy|scripts/start_dome_proxy.sh|||"
    "engine|terrarium-engine|Engine|python3 src/engine/scheduler.py|||"
    "portal|terrarium-portal|Portal|src/portals/telegram/.venv/bin/python -m src.portals.telegram.bot|||"
    "bridge|terrarium-bridge|Bridge|uvx mcpo --port 8765 --api-key \"terrarium-mcp-bridge\" --config src/configs/mcpo.json --hot-reload|||"
    "archive|terrarium-archive|Archive|scripts/start_archive.sh|||"
    "archive-proxy|terrarium-archive-proxy|Archive Auth Proxy|scripts/start_archive_proxy.sh|||"
    "web|terrarium-web|Web|npm run dev|web||"
    "jarvis|terrarium-jarvis|Jarvis|scripts/start_jarvis.sh|||"
    "incubator|terrarium-incubator|Incubator Scheduler|scripts/start_incubator.sh start|||"
)

# Tunnel definitions
# Format: name|session|display_name|port|emoji|send_notification
TUNNELS=(
    "dome|terrarium-tunnel-dome|Dome|8080|🌐✨|true"
    "archive-api|terrarium-tunnel-archive-api|Archive API|5055|🔌|false"
    "archive|terrarium-tunnel-archive|Archive|8502|📚🔍|true"
    "web|terrarium-tunnel-web|Web|3000|🖥️🌍|true"
    "jarvis|terrarium-tunnel-jarvis|Jarvis|3002|🤖💫|true"
)
# Note: archive-api is protected by Cloudflare Access (see docs/CLOUDFLARE_ACCESS.md)
# Removed: ssh (security - use Tailscale/Cloudflare Access instead)

# Service name to session mapping for attach command
declare -A SERVICE_MAP=(
    ["dome"]="terrarium-dome"
    ["dome-proxy"]="terrarium-dome-proxy"
    ["engine"]="terrarium-engine"
    ["portal"]="terrarium-portal"
    ["bridge"]="terrarium-bridge"
    ["tunnel"]="terrarium-tunnel-dome"
    ["tunnel-dome"]="terrarium-tunnel-dome"
    ["tunnel-archive-api"]="terrarium-tunnel-archive-api"
    ["tunnel-archive"]="terrarium-tunnel-archive"
    ["tunnel-web"]="terrarium-tunnel-web"
    ["archive"]="terrarium-archive"
    ["archive-proxy"]="terrarium-archive-proxy"
    ["web"]="terrarium-web"
    ["jarvis"]="terrarium-jarvis"
    ["tunnel-jarvis"]="terrarium-tunnel-jarvis"
    ["incubator"]="terrarium-incubator"
)
