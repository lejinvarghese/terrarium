[project]
name = "terrarium"
version = "0.1.0"
description = "Terrarium utilities MCP server"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.2.0",
    "runware>=0.4.30",
    "schedule>=1.2.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "recipe-scrapers>=15.0.0",
    "python-telegram-bot>=21.0.0",
    "mem0ai>=1.0.1",
    "sqlalchemy>=2.0.0",
    "pillow>=10.0.0",
    "ollama>=0.6.1",
    "agno>=2.3.12",
]

[project.optional-dependencies]
incubator = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "accelerate>=1.0.0",
    "smolagents>=1.0.0",
    "peft>=0.13.0",
    "trl>=0.11.0",
    "playwright>=1.40.0",
    "bitsandbytes>=0.44.0",
]

dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
