[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrarium"
version = "0.1.0"
description = "Terrarium utilities MCP server"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.2.0",
    "runware>=0.4.30",
    "schedule>=1.2.0",
    "python-dotenv>=1.0.0",
    "click>=8.0.0",
    "recipe-scrapers>=15.0.0",
    "python-telegram-bot>=21.0.0",
    "mem0ai>=1.0.1",
    "sqlalchemy>=2.0.0",
    "pillow>=10.0.0",
    "ollama>=0.6.1",
    "agno>=2.3.12",
    "anthropic>=0.75.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
incubator = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "accelerate>=1.0.0",
    "smolagents>=1.0.0",
    "peft>=0.13.0",
    "trl>=0.11.0",
    "playwright>=1.40.0",
    "bitsandbytes>=0.44.0",
]

dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "complexipy>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/*.py" = ["E402"]  # Allow imports not at top in scripts
"utils/**/*.py" = ["E741", "F841"]  # Allow ambiguous variable names in utils
